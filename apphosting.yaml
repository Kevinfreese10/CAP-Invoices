# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# Settings for Cloud Run
runConfig:
  minInstances: 1
  maxInstances: 100
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment variables
env:
  - variable: STORAGE_BUCKET
    value: cap-invoices-79739504-a3754.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: https://www.cap.myacc.co.za
    availability:
      - BUILD
      - RUNTIME
  - variable: IMAP_HOST
    value: mail.myacc.co.za
  - variable: IMAP_PORT
    value: "993"
  - variable: IMAP_USER
    value: invoices2@myacc.co.za
  - variable: SYSTEM_SMTP_HOST
    value: mail.myacc.co.za
  - variable: SYSTEM_SMTP_PORT
    value: "465"
  - variable: SYSTEM_SMTP_USER
    value: no_reply@myacc.co.za
  - variable: INFO_SMTP_HOST
    value: mail.myacc.co.za
  - variable: INFO_SMTP_PORT
    value: "465"
  - variable: INFO_SMTP_USER
    value: info@myacc.co.za
